<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" fill="none">
  <!-- Star -->
  <polygon points="60,4 62.4,11.2 70,11.2 63.8,15.6 66.2,22.8 60,18.4 53.8,22.8 56.2,15.6 50,11.2 57.6,11.2"
           fill="#7A9EC0" opacity="0.85"/>

  <!-- Open book pages (left) -->
  <path d="M10 30 L10 88 L58 82 L58 28 Z" stroke="#1A4A7A" stroke-width="2.5" fill="rgba(26,74,122,0.08)" stroke-linejoin="round"/>
  <!-- page lines left -->
  <line x1="16" y1="40" x2="52" y2="37" stroke="#1A4A7A" stroke-width="1.2" opacity="0.4"/>
  <line x1="16" y1="48" x2="52" y2="45" stroke="#1A4A7A" stroke-width="1.2" opacity="0.4"/>

  <!-- Open book pages (right) -->
  <path d="M110 30 L110 88 L62 82 L62 28 Z" stroke="#1A4A7A" stroke-width="2.5" fill="rgba(26,74,122,0.08)" stroke-linejoin="round"/>
  <!-- page lines right -->
  <line x1="104" y1="40" x2="68" y2="37" stroke="#1A4A7A" stroke-width="1.2" opacity="0.4"/>
  <line x1="104" y1="48" x2="68" y2="45" stroke="#1A4A7A" stroke-width="1.2" opacity="0.4"/>

  <!-- Book spine / binding -->
  <path d="M58 28 Q60 26 62 28 L62 82 Q60 84 58 82 Z" fill="#1A4A7A" opacity="0.6"/>

  <!-- Book bottom curve -->
  <path d="M10 88 Q60 98 110 88" stroke="#1A4A7A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Spine bottom post -->
  <line x1="60" y1="92" x2="60" y2="102" stroke="#1A4A7A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Base circle -->
  <circle cx="60" cy="104" r="4" stroke="#1A4A7A" stroke-width="2" fill="none"/>

  <!-- Compass outer circle -->
  <circle cx="60" cy="57" r="22" stroke="#1A4A7A" stroke-width="2" fill="rgba(255,255,255,0.04)"/>
  <circle cx="60" cy="57" r="18" stroke="#1A4A7A" stroke-width="1" opacity="0.4" fill="none"/>

  <!-- Compass tick marks -->
  <line x1="60" y1="36" x2="60" y2="40" stroke="#1A4A7A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="74" x2="60" y2="78" stroke="#1A4A7A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="57" x2="43" y2="57" stroke="#1A4A7A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="77" y1="57" x2="81" y2="57" stroke="#1A4A7A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- N label -->
  <text x="60" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="#1A4A7A">N</text>

  <!-- Compass needle (NE pointing) -->
  <polygon points="60,39 57,57 60,55 63,57" fill="#1A4A7A"/>
  <polygon points="60,75 57,57 60,59 63,57" fill="#7A9EC0" opacity="0.7"/>

  <!-- Center dot -->
  <circle cx="60" cy="57" r="2.5" fill="#1A4A7A"/>
</svg>
